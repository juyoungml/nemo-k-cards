name: Secret scan
# The repo is public: gitleaks (MIT) checks every commit for secrets, next to GitGuardian.
# It runs the gitleaks CLI directly (pinned version, checksum-verified) rather than gitleaks-action,
# so there is no license key and no third-party action with access to the token.
# Any finding fails the check. Output is redacted, so a leaked value never lands in the CI log.
#
# A finding that is a real secret: rotate it first, then remove it from the code. History is not
# rewritten, so the old commit keeps failing the scan; after rotating, add the finding's Fingerprint
# (from a local `gitleaks git --redact`) to a .gitleaksignore file with a comment saying it was rotated.
# A finding that is a test fixture: allowlist it in .gitleaks.toml by path AND rule, never globally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # whole history: a secret added and then deleted in a later commit is still public
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
