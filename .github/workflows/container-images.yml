name: Container images
# Builds the API and Admin images (backend/Dockerfile, apps/web/Dockerfile) and validates deploy/compose.yml.
#
# Pull requests (and Run workflow): build both images and smoke-test them, push nothing, use no secrets and a
#   read-only token. There is no pull_request_target anywhere, so a fork's code never runs with secrets.
# Push to main: run the backend and web checks first (the same workflows PRs run, via workflow_call), and only
#   if both pass, build and push the PRIVATE images to GHCR, tagged by commit:
#     ghcr.io/<owner>/<repo>-api:sha-<full sha>              (+ sha-<7>)   one image for every environment
#     ghcr.io/<owner>/<repo>-admin:staging-sha-<full sha>    (+ staging-sha-<7>)   built for staging's Supabase
#   The deploy button (#60) re-tags one commit's pair as `staging`; servers pull that tag (#61).
# See deploy/README.md for the variables this needs and how a server gets a read-only pull token.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'apps/web/**'
      - 'agent/**'
      - 'policies/**'
      - 'demo/scenarios/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/container-images.yml'
  # Every commit on main gets images (no path filter), so the deploy button can deploy any commit of main.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Per commit on main (every commit must get its images; a shared group would drop queued runs),
  # per branch elsewhere, where a newer push makes the older run pointless.
  group: container-images-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  # --- Gate (main only): the same checks pull requests run. Images are pushed only after both pass. ----------
  backend-checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend-checks.yml
  web-checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/web-checks.yml

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The env template stands in for a server's stack env file: every name it lists must parse.
      - name: docker compose config
        env:
          ENV_FILE: ${{ github.workspace }}/deploy/env.example
        run: |
          docker compose version
          docker compose -f deploy/compose.yml --env-file deploy/env.example config --quiet
          docker compose -f deploy/compose.yml --env-file deploy/env.example --profile tunnel config --quiet

  # --- Pull requests: build and smoke-test, push nothing ----------------------------------------------------
  api:
    name: build api image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: nemo-k-cards-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # Not a smoke test of the running API (that needs Postgres and Supabase: deploy/README.md's checklist).
      # It checks the image holds what the API reads at run time, and nothing it must not.
      - name: inspect image
        run: |
          run() { docker run --rm --entrypoint "" nemo-k-cards-api:ci "$@"; }
          run id
          run claude --version
          run python -c "import app.main; print('app.main imports')"
          run python -c "from playwright.sync_api import sync_playwright as p; b = p().start().chromium.launch(); print('chromium', b.version); b.close()"
          run sh -ec '
            for f in /app/agent/CLAUDE.md /app/agent/.claude/agents/researcher.md /app/agent/.claude/skills \
                     /app/policies/content/safeguard_policy.md /app/policies/content/sensitive_topics.yaml \
                     /app/policies/openshell/agent-policy.yaml /app/demo/scenarios/good/deck.json \
                     /app/backend/app/renderer/templates; do
              test -e "$f" || { echo "missing $f"; exit 1; }
            done
            for f in /app/backend/tests /app/backend/golden /app/backend/.data /app/apps /app/.git; do
              test ! -e "$f" || { echo "should not be in the image: $f"; exit 1; }
            done'
          # As root, so the search can read every directory. Package internals under .venv and /usr are skipped.
          leaks=$(docker run --rm --entrypoint "" --user 0 nemo-k-cards-api:ci \
            find / -xdev \( -name ".env" -o -name ".env.*" -o -name ".envrc" -o -name "settings.local.json" \) \
              -not -path "/proc/*" -not -path "/app/backend/.venv/*" -not -path "/usr/*" -print)
          test -z "$leaks" || { echo "env or local settings file in image: $leaks"; exit 1; }
          echo "image contents ok"

  admin:
    name: build admin image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # Public build args only (they ship to every browser). A pull request build uses placeholders, which is
      # enough to compile; the pushed image on main gets staging's values (push-admin below).
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          load: true
          tags: nemo-k-cards-admin:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      # The Admin holds no secrets and needs no backend to serve its sign-in page, so it can start here.
      - name: start image and load /sign-in
        run: |
          docker run -d --name admin -p 3000:3000 nemo-k-cards-admin:ci
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/sign-in || true)
            [ "$code" = 200 ] && break; sleep 1
          done
          docker logs admin
          test "$code" = 200 || { echo "/sign-in answered $code"; exit 1; }
          docker exec admin id

  # --- Main: push to GHCR after the checks pass. Only these two jobs can write packages. ---------------------
  push-api:
    name: push api image
    needs: [backend-checks, web-checks, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # Image names are lowercased by metadata-action. Labels include org.opencontainers.image.revision=<sha>
      # (the server's status shows it) and .source, which links the package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=long
            type=sha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same scope as the PR build: main's cache is readable by every branch, so PR builds start warm.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: package must be private
        env:
          IMAGE: ${{ github.repository }}-api
        run: .github/scripts/ghcr-assert-private.sh "$IMAGE"
      - name: summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### API image pushed"
            echo '```'
            echo "$TAGS"
            echo "digest $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  push-admin:
    name: push admin image (staging)
    needs: [backend-checks, web-checks, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The Admin is built for one Supabase project (Next inlines NEXT_PUBLIC_* at build time). These are
      # REPOSITORY variables, not `staging` environment variables: a job that names the `staging` environment
      # waits for its required reviewer, which would gate every merge. Both values are public by design.
      # Refuse anything that is not a publishable key, so a secret key can never be baked into the bundle.
      - name: staging's public Supabase settings
        env:
          SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::repository variable STAGING_NEXT_PUBLIC_SUPABASE_URL must be https://<ref>.supabase.co (see deploy/README.md)"; exit 1 ;;
          esac
          case "$SUPABASE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::repository variable STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be a publishable key (sb_publishable_...), never a secret key"; exit 1 ;;
          esac
          echo "Admin is built for $SUPABASE_URL"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-admin
          tags: |
            type=sha,format=long,prefix=staging-sha-
            type=sha,prefix=staging-sha-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Own scope, so it doesn't evict the placeholder build's cache (different build args).
          cache-from: type=gha,scope=admin-staging
          cache-to: type=gha,scope=admin-staging,mode=max
      - name: package must be private
        env:
          IMAGE: ${{ github.repository }}-admin
        run: .github/scripts/ghcr-assert-private.sh "$IMAGE"
      - name: summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Admin image pushed (staging Supabase project)"
            echo '```'
            echo "$TAGS"
            echo "digest $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
