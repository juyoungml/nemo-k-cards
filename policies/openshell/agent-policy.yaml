# What's On Korea — agent sandbox policy (SPEC §8, BACKEND §11 #7 #13)
# Schema: https://docs.nvidia.com/openshell/latest/how-it-works/policies/schema
#
#   openshell sandbox create --from whatsonkorea-agent:latest --policy policies/openshell/agent-policy.yaml \
#     --provider claude-code --workdir /sandbox/agent --no-keep -- claude -p '...'
#   openshell logs <sandbox> --source sandbox     # policy_denied events → Admin Policy Log
#
# Binary paths are real paths in infra/sandbox/Dockerfile (OpenShell ignores symlinks and pins each
# binary's hash). A rule also covers processes a listed binary starts, so tools that `claude` runs
# (e.g. curl from its Bash tool) get exactly the same reach as `claude` itself.
#
# Inference (api.anthropic.com) is not listed here: the claude-code provider profile
# (policies/openshell/providers/claude-code.yaml) contributes that rule together with the API key.

version: 1

filesystem_policy:
  # The workdir (/sandbox/agent) holds CLAUDE.md and the subagent prompts; keep it read-only so a
  # prompt-injected agent cannot rewrite its own instructions.
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log, /sandbox/agent, /sandbox/input]
  # Claude Code keeps its session state in /tmp/claude (CLAUDE_CONFIG_DIR in the image).
  read_write: [/sandbox/out, /tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Public event / map APIs — read-only, L7 enforced.
  public_data:
    name: korea-public-data-readonly
    endpoints:
      - { host: apis.data.go.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: dapi.kakao.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: openapi.naver.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      # Seoul Open API is plain HTTP on 8088.
      - { host: openapi.seoul.go.kr, port: 8088, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/curl }

  # Event / ticketing pages for WebFetch — GET only. Add hosts with `openshell policy update` when a
  # denied fetch shows up in the logs.
  event_pages:
    name: event-pages-readonly
    endpoints:
      - { host: korean.visitkorea.or.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: english.visitkorea.or.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: culture.seoul.go.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: english.seoul.go.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: www.visitseoul.net, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: tickets.interpark.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: www.popply.co.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: popply.co.kr, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: /usr/local/bin/claude }

  # Instagram: the agent may at most READ. POST (publish) and DELETE are denied at L7 and logged.
  # Publishing uses the Instagram Login API (graph.instagram.com) from the host publisher; the older
  # Facebook Graph host is guarded too. No credential is injected here, so even a GET is anonymous.
  instagram_guard:
    name: instagram-no-write
    endpoints:
      - { host: graph.instagram.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: graph.facebook.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/curl }

# Everything else (pastebin, webhooks, arbitrary hosts) is denied by default.
