[project]
name = "whatsonkorea-backend"
version = "0.1.0"
description = "What's On Korea — pipeline orchestrator, renderer, QA, publisher"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "httpx-secure>=2.0,<3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.10",
    "dbos>=3.4,<4",
    "pyyaml>=6.0.3",
    "pypdf>=6,<7",
    "pillow>=11",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
